# Hue scene control map — one row per "scene" (a Hue room/zone).
#
# Format:  key | group-id | bright-scene | chill-scene | label
#   key           short name you type (vicinae script keyword / CLI arg)
#   group-id      Hue group id (run `hue list`, or see the bridge)
#   bright-scene  Hue scene name recalled for "bright"
#   chill-scene   Hue scene name recalled for "chill"
#   label         human label shown in notifications
#
# Scene names must match the bridge exactly (they may contain spaces).
# Edit freely, then `chezmoi apply`. Add a row per room you want to control.
# A new row only reaches the CLI; to get it into the vicinae launcher too, add
# the three matching scripts under
# dot_local/share/vicinae/scripts/hue/executable_<key>-{bright,chill,off}.sh.
office  | 3  | Hell | Entspannen | Office (Arbeitszimmer)
living  | 4  | Hell | Entspannen | Living Room (Wohnzimmer)
meeting | 6  | Hell | Entspannen | Couch Meeting
bedroom | 7  | Hell | Entspannen | Bedroom (Schlafzimmer)
couch   | 9  | Hell | Entspannen | Couch
zoom    | 11 | Hell | Entspannen | Zoom Light
