# espanso snippets ("matches") — managed by chezmoi.
# Docs: https://espanso.org/docs/matches/basics/
#
# Migrated from Raycast (Snippets export 2026-08-04). Raycast's {clipboard}
# placeholder maps to espanso's {{clipboard}} var (defined once per match).
# Type the trigger and espanso expands it, inserting the current clipboard.

matches:
  # Go: Printf a value with its clipboard'd expression name (%#v).
  # Literal \n \t are Go escapes and must stay as backslash sequences (single-
  # quoted YAML keeps backslashes literal).
  - trigger: "fmtv"
    replace: 'fmt.Printf("\n\t {{clipboard}} --> %#v\n", {{clipboard}})'
    vars:
      - name: clipboard
        type: clipboard

  # Go: bracketed stack trace around a labelled section (real multi-line).
  - trigger: "fmttrace"
    replace: |-
      fmt.Println("===== {{clipboard}} ======")
      debug.PrintStack()
      fmt.Println("===== {{clipboard}} (END) ======")
    vars:
      - name: clipboard
        type: clipboard

  # Go: dump a graph's Dot() output, fenced by labelled markers (trailing NL).
  - trigger: "fmtgraph"
    replace: |
      fmt.Println("vvvvvvvv {{clipboard}} vvvvvvvv")
      fmt.Println(string(g.Dot(nil)))
      fmt.Println("======= {{clipboard}} =======")
    vars:
      - name: clipboard
        type: clipboard

  # Terraform provider: tflog.Warn a value with its expression name (%#v).
  - trigger: "tflogv"
    replace: 'tflog.Warn(ctx, fmt.Sprintf("{{clipboard}} --> %#v", {{clipboard}}))'
    vars:
      - name: clipboard
        type: clipboard
