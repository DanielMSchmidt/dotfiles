packages:
    universal:
        taps:
            # Every tap referenced by a fully-qualified brew or cask below
            # belongs here. Leaving one out happens to work — brew auto-taps a
            # fully-qualified name — but then the profile that does not declare
            # it silently depends on that fallback.
            #
            # The reverse needs checking too: this list is the trust boundary
            # the install script feeds to `brew trust`, so an unreferenced tap
            # is pure trust surface. Three were dropped for that reason —
            # 1password/tap and charmbracelet/tap because their packages
            # (1password-cli, vhs) now come from core and the tap had stopped
            # being load-bearing without looking like it, since both are
            # declared below by their unqualified names; yakitrak/yakitrak
            # because nothing from it was ever declared at all. Confirm with
            # the install receipt (`.source.tap`), not `brew info` — an
            # untrusted tap reports no tap at all.
            - "anomalyco/tap"
            - "arthur-ficial/tap"
            - "danielmschmidt/homebrew-tap"
            - "git-duet/tap"
            - "stripe/stripe-cli"
